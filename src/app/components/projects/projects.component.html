<div class="projects-content">
  <h2>Projects</h2>
  <div class="project-grid">
    <mat-card *ngFor="let project of projects" class="project-card" [@fadeIn]>
      <mat-card-header>
        <mat-card-title>{{ project.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <ul>
          <li *ngFor="let desc of project.description">{{ desc }}</li>
        </ul>
      </mat-card-content>
    </mat-card>
  </div>
</div>
