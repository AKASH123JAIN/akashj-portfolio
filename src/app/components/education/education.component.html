<!-- src/app/components/education/education.component.html -->
<div class="education-content">
  <h2>Education</h2>
  <div class="education-item">
    <h3>{{ education.degree }}</h3>
    <p>{{ education.college }} • {{ education.period }}</p>
  </div>
  <h2>Achievements & Certifications</h2>
  <div class="achievements-grid">
    <a *ngFor="let ach of achievements" [href]="ach.link" target="_blank" class="achievement-card">
      <div class="achievement-icon">
        <img [src]="ach.logoUrl" [alt]="ach.name" (error)="handleImageError($event)"
          style="width: 24px; height: 24px; object-fit: contain;">
      </div>
      <div class="achievement-info">
        <h3>{{ ach.name }}</h3>
        <p>{{ ach.issuer }}</p>
        <span class="view-credential">View Credential <mat-icon>open_in_new</mat-icon></span>
      </div>
    </a>
  </div>
</div>
